name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build (and sign) without publishing a release — for
  # testing the pipeline, e.g. after rotating signing secrets.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the key without a UI prompt (headless runner)
          security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
      - name: Store notarization credentials
        if: env.APPLE_APP_PASSWORD != ''
        run: |
          xcrun notarytool store-credentials ci-notary \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD"
      - name: Build DMG
        run: |
          if [[ -n "$MACOS_CERT_P12" ]]; then
            export CODESIGN_IDENTITY="Developer ID Application: Qiliang Huang (3QCL9WNFBB)"
          fi
          if [[ -n "$APPLE_APP_PASSWORD" ]]; then
            export NOTARY_PROFILE=ci-notary
          fi
          bash packaging/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller --noconfirm packaging/stellarpulse.spec
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c "exec(open('src/version.py').read()); print(__version__)")" >> "$GITHUB_OUTPUT"
      - name: Build installer
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\iscc.exe" /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  build-linux:
    # Oldest supported LTS: binaries link against its glibc, so the deb
    # runs on Ubuntu 22.04+ / Debian 12+. ubuntu-latest (24.04) would
    # produce binaries that fail on 22.04 with GLIBC version errors.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build deb
        run: bash packaging/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
